<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Подключаем библиотеки -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Убираем лишние отступы */
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>

    <!-- Сцена AR -->
    <!-- Убедись, что targets.mind лежит в той же папке! -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no;" 
             embedded color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Твоя модель. Проверь, что имя файла совпадает! -->
        <a-asset-item id="myModel" src="./model.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Этот блок отвечает за то, что появится ПОВЕРХ картинки -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- 1. СИНИЙ КУБ (ТЕСТОВЫЙ) -->
        <!-- Если видишь его — значит AR работает! -->
        <a-box color="blue" opacity="0.6" scale="0.3 0.3 0.3" position="0 0 0"></a-box>
        
        <!-- 2. ТВОЯ МОДЕЛЬ -->
        <!-- Если куб есть, а модели нет — пробуй менять scale на 0.01 или 1 -->
        <a-gltf-model src="#myModel" 
                      scale="0.1 0.1 0.1" 
                      position="0 0 0.1"
                      rotation="0 0 0">
        </a-gltf-model>

        <!-- 3. СВЕТ (чтобы модель не была черной) -->
        <a-light type="ambient" intensity="1.5"></a-light>
        <a-light type="directional" position="0 10 10" intensity="1"></a-light>

      </a-entity>
    </a-scene>

  </body>
</html>
