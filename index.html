<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r123/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>
    
    <style>
        /* Убираем черный фон, чтобы видеть камеру */
        body { margin: 0; overflow: hidden; background-color: transparent; }
        
        /* Гарантируем, что видео и холст занимают весь экран */
        canvas { position: absolute; top: 0; left: 0; z-index: 2; }
        video { position: absolute; top: 0; left: 0; z-index: 1; }

        #status {
            position: absolute; top: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.6); color: white;
            padding: 15px; font-family: sans-serif; text-align: center; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="status">Запуск системы...</div>

    <script>
        const status = document.getElementById('status');

        async function start() {
            try {
                // Инициализация MindAR
                const mindarThree = new window.MINDAR.IMAGE.MindARThree({
                    container: document.body,
                    imageTargetSrc: './targets.mind', 
                });

                const {renderer, scene, camera} = mindarThree;

                // Настройка рендерера для прозрачности (чтобы видеть видео)
                renderer.setClearColor(0x000000, 0); 

                // Создаем КУБ-МАЯК (Красный, яркий)
                const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const material = new THREE.MeshBasicMaterial({color: 0xff0000});
                const cube = new THREE.Mesh(geometry, material);

                // Привязываем куб к первому маркеру
                const anchor = mindarThree.addAnchor(0);
                anchor.group.add(cube);

                // Обработка событий
                anchor.onTargetFound = () => {
                    status.innerText = "МАРКЕР НАЙДЕН!";
                    status.style.background = "green";
                };

                anchor.onTargetLost = () => {
                    status.innerText = "Ищу маркер...";
                    status.style.background = "rgba(0,0,0,0.6)";
                };

                // Запуск
                status.innerText = "Включаю камеру...";
                await mindarThree.start();
                
                status.innerText = "Камера работает. Наведи на маркер!";

                // Цикл рендеринга
                renderer.setAnimationLoop(() => {
                    cube.rotation.y += 0.03; // Куб будет крутиться
                    renderer.render(scene, camera);
                });

            } catch (e) {
                status.innerText = "ОШИБКА: " + e.message;
                console.error(e);
            }
        }

        window.addEventListener('load', start);
    </script>
</body>
</html>
