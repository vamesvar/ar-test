<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR Local Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r123/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #status {
            position: absolute; top: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.7); color: white;
            padding: 15px; font-family: sans-serif; text-align: center; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="status">Инициализация...</div>

    <script>
        const status = document.getElementById('status');

        async function start() {
            try {
                // ПРОВЕРКА: Пытаемся понять, видит ли браузер ваш файл
                status.innerText = "Загрузка файла targets.mind...";
                
                const mindarThree = new window.MINDAR.IMAGE.MindARThree({
                    container: document.body,
                    imageTargetSrc: './targets.mind', // Ищем файл в той же папке
                });

                const {renderer, scene, camera} = mindarThree;

                // Создаем красный куб
                const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                const material = new THREE.MeshBasicMaterial({color: 0xff0000, transparent: true, opacity: 0.7});
                const cube = new THREE.Mesh(geometry, material);

                const anchor = mindarThree.addAnchor(0);
                anchor.group.add(cube);

                anchor.onTargetFound = () => {
                    status.innerText = "МАРКЕР НАЙДЕН!";
                    status.style.background = "green";
                };

                anchor.onTargetLost = () => {
                    status.innerText = "Маркер потерян. Ищу снова...";
                    status.style.background = "rgba(0,0,0,0.7)";
                };

                await mindarThree.start();
                status.innerText = "Камера включена. Наведите на ВАШУ картинку";

                renderer.setAnimationLoop(() => {
                    renderer.render(scene, camera);
                });

            } catch (e) {
                status.innerText = "ОШИБКА: " + e.message;
                console.error("Детали ошибки:", e);
            }
        }

        window.addEventListener('load', start);
    </script>
</body>
</html>
