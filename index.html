<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Используем самые стабильные версии библиотек -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Убираем лишние элементы интерфейса, которые могут перекрывать экран */
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- 
      ВНИМАНИЕ: Для теста я заменил путь к вашему файлу на прямую ссылку на тестовый маркер.
      Если это сработает, значит проблема в вашем файле .mind 
    -->
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/examples/assets/card-example/card.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Пока вместо вашей модели используем красный куб, чтобы точно увидеть результат -->
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-box position="0 0 0" scale="0.5 0.5 0.5" material="color: red; opacity: 0.8"></a-box>
      </a-entity>
    </a-scene>
  </body>
</html>
