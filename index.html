<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>WebAR Local Test</title>
    <!-- Оставляем твои рабочие библиотеки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r123/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>
    <!-- ДОБАВЛЯЕМ загрузчик для 3D моделей той же версии r123 -->
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r123/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #status {
            position: absolute; top: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.7); color: white;
            padding: 15px; font-family: sans-serif; text-align: center; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="status">Инициализация...</div>

    <script>
        const status = document.getElementById('status');

        async function start() {
            try {
                status.innerText = "Загрузка файла targets.mind...";
                
                const mindarThree = new window.MINDAR.IMAGE.MindARThree({
                    container: document.body,
                    imageTargetSrc: './targets.mind',
                });

                const {renderer, scene, camera} = mindarThree;

                // --- ДОБАВЛЯЕМ СВЕТ (Важно для твоей модели!) ---
                const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
                scene.add(ambientLight);
                const directLight = new THREE.DirectionalLight(0xffffff, 1);
                directLight.position.set(0, 10, 10);
                scene.add(directLight);

                const anchor = mindarThree.addAnchor(0);

                // --- ЗАГРУЗКА ТВОЕЙ МОДЕЛИ ---
                const loader = new THREE.GLTFLoader();

loader.load('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb', (gltf) => {
    const model = gltf.scene;
    model.scale.set(0.2, 0.2, 0.2); // Утка маленькая, 0.2 будет в самый раз
    anchor.group.add(model);
    console.log("Утка из интернета приплыла!");
});
                            

                // Оставляем твой куб как "маяк", чтобы видеть, что AR работает
                const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                const material = new THREE.MeshBasicMaterial({color: 0xff0000, transparent: true, opacity: 0.5});
                const cube = new THREE.Mesh(geometry, material);
                anchor.group.add(cube);

                anchor.onTargetFound = () => {
                    status.innerText = "МАРКЕР НАЙДЕН!";
                    status.style.background = "green";
                };

                anchor.onTargetLost = () => {
                    status.innerText = "Маркер потерян...";
                    status.style.background = "rgba(0,0,0,0.7)";
                };

                await mindarThree.start();
                status.innerText = "Камера готова. Наведите на картинку";

                renderer.setAnimationLoop(() => {
                    renderer.render(scene, camera);
                });

            } catch (e) {
                status.innerText = "ОШИБКА: " + e.message;
            }
        }

        window.addEventListener('load', start);
    </script>
</body>
</html>
